<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ec5fb"/>
      <stop offset="0.45" stop-color="#1e7fe8"/>
      <stop offset="1" stop-color="#1537a8"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0b2a8f" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#0b2a8f" stop-opacity="0.5"/>
    </linearGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
    <linearGradient id="diskBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eef4ff"/><stop offset="1" stop-color="#c3d5f7"/>
    </linearGradient>
    <linearGradient id="sliceBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#ea8a0c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="-6" dy="10" stdDeviation="10" flood-color="#0b1a4a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- sweeping curve -->
    <path d="M-20 470 C 140 400, 330 330, 540 110 L540 540 L-20 540 Z" fill="url(#sweep)"/>
    <path d="M-20 470 C 140 400, 330 330, 540 110" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3"/>
    <ellipse cx="90" cy="30" rx="260" ry="160" fill="#ffffff" opacity="0.08"/>
  </g>
  <g transform="translate(-6 16)">
    <path d="M90 290 v70 a110 32 0 0 0 220 0 v-70 z" fill="url(#diskBody)"/>
    <ellipse cx="200" cy="290" rx="110" ry="32" fill="#ffffff"/>
    <path d="M90 120 v70 a110 32 0 0 0 220 0 v-70 z" fill="url(#diskBody)"/>
    <ellipse cx="200" cy="120" rx="110" ry="32" fill="#ffffff"/>
    <path d="M90 205 v70 a110 32 0 0 0 220 0 v-70 a110 32 0 0 0 -220 0 z"
          fill="none" stroke="#e2ecff" stroke-opacity="0.6" stroke-width="5" stroke-dasharray="12 10"/>
    <g filter="url(#shadow)">
      <path d="M202 205 v70 a110 32 0 0 0 220 0 v-70 z" fill="url(#sliceBody)"/>
      <ellipse cx="312" cy="205" rx="110" ry="32" fill="#fcd34d"/>
    </g>
    <g fill="#78350f">
      <circle cx="264" cy="270" r="10"/><circle cx="296" cy="273" r="10"/>
      <circle cx="328" cy="273" r="10"/><circle cx="360" cy="270" r="10"/>
    </g>
  </g>
</svg>
